name: pipeline

on:
  push:
    branches: [main]
    # build-maps.yml and swift.yml are listed because tests/test_workflows.py checks them.
    paths: ["pipeline/**", "config/**", ".github/workflows/pipeline.yml", ".github/workflows/build-maps.yml", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["pipeline/**", "config/**", ".github/workflows/pipeline.yml", ".github/workflows/build-maps.yml", ".github/workflows/swift.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  # Only PR runs cancel each other; a run on main always finishes and uploads its artifact.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q

  smoke:
    # Pins, cached binaries and runtime-library names verified on 24.04 only; moving images is deliberate: bump the runner, add the image to the cache key, re-bootstrap.
    runs-on: ubuntu-24.04
    needs: unit
    timeout-minutes: 30
    env:
      # Must match the pins in pipeline/bootstrap.sh and maqs.tools.PINS.
      TOOLS_KEY: versatiles-5.0.0-pmtiles-1.31.2-osmium-1.19.1-tippecanoe-2.79.0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { enable-cache: true }
      - name: Cache tool binaries
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/bin/versatiles
            /usr/local/bin/pmtiles
            /usr/local/bin/osmium
            /usr/local/bin/tippecanoe
            /usr/local/bin/tile-join
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLS_KEY }}
      # The extract is the one config/regions.yaml gives the test region (europe/italy/nord-est);
      # keying the cache on Geofabrik's published md5 re-downloads only when the file changes.
      - name: Geofabrik extract checksum
        id: geofabrik
        shell: bash
        run: |
          md5=$(curl -fsSL -A "maqs-pipeline-ci (+https://github.com/lucavallin/maqs)" \
            https://download.geofabrik.de/europe/italy/nord-est-latest.osm.pbf.md5 | cut -d' ' -f1)
          [[ "$md5" =~ ^[0-9a-f]{32}$ ]] || { echo "bad md5: '$md5'" >&2; exit 1; }
          echo "md5=$md5" >> "$GITHUB_OUTPUT"
      - name: Cache the Geofabrik extract
        uses: actions/cache@v6
        with:
          path: .cache/geofabrik
          key: geofabrik-nord-est-${{ steps.geofabrik.outputs.md5 }}
      - name: Bootstrap tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: pipeline/bootstrap.sh
      - name: Runtime libraries for cached binaries
        if: steps.tools-cache.outputs.cache-hit == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q libboost-program-options1.83.0 liblz4-1 libexpat1 libbz2-1.0 libsqlite3-0
      - run: pipeline/bootstrap.sh --check
      - run: uv sync --frozen
        working-directory: pipeline
      - run: uv run maqs check-tools
        working-directory: pipeline
      - name: Build the test region
        run: uv run maqs build --region test --dist "$GITHUB_WORKSPACE/dist" --cache "$GITHUB_WORKSPACE/.cache"
        working-directory: pipeline
      - run: cat dist/test/build-report.json
      - name: Build the base packs
        # The manifest requires every configured base pack (a 13 MB range-request extract, ADR 0007).
        run: uv run maqs build --region base --dist "$GITHUB_WORKSPACE/dist" --cache "$GITHUB_WORKSPACE/.cache"
        working-directory: pipeline
      - name: Assemble and validate a CI manifest from the test build
        run: |
          uv run maqs manifest --release data-ci --dist "$GITHUB_WORKSPACE/dist" --regions test
          uv run maqs check-config --manifest "$GITHUB_WORKSPACE/dist/manifest.json"
        working-directory: pipeline
      - name: Assert the fixture budget (live network test)
        # Builds the test region again into a temp dir (reusing the repo-root .cache) and asserts
        # all five layers' outputs and row-count ranges plus gzip, zoom, tile type, tile count and
        # the 5 MB budget, so a fixture regression fails CI instead of warning.
        run: uv run pytest tests/test_integration_network.py --run-network -q
        working-directory: pipeline
      - uses: actions/upload-artifact@v7
        with:
          name: test-region-fixtures
          path: |
            dist/test
            dist/manifest.json
          retention-days: 7
          if-no-files-found: error
