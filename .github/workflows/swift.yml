name: swift

on:
  push:
    branches: [main]
    paths:
      - Package.swift
      - Package.resolved
      - "Sources/**"
      - "Tests/**"
      - scripts/update-fixtures.sh
      - scripts/update-map-assets.sh
      - "Examples/**"
      - config/sources.json
      - .github/workflows/swift.yml
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - "Sources/**"
      - "Tests/**"
      - scripts/update-fixtures.sh
      - scripts/update-map-assets.sh
      - "Examples/**"
      - config/sources.json
      - .github/workflows/swift.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: MapLibre is imported only by MaqsUI and its test target
        run: |
          # MaqsUITests draws maps in the package's test bundle, so it imports MapLibre too; nothing else may.
          if grep -rl --include='*.swift' -E '^\s*(@_exported\s+)?import\s+MapLibre' Sources Tests Examples 2>/dev/null | grep -v -E '^(Sources/MaqsUI|Tests/MaqsUITests)/'; then
            echo 'import MapLibre outside Sources/MaqsUI and Tests/MaqsUITests' >&2; exit 1
          fi
      - name: Bundled sources.json matches config/sources.json
        run: cmp config/sources.json Sources/MaqsCore/Resources/sources.json
      - name: MaqsTerrain and MaqsCore carry the same version
        run: |
          # Both modules send Maqs/<version> in their User-Agent; MaqsTerrain keeps its own copy because it never imports MaqsCore.
          core=$(grep -o 'static let string = "[^"]*"' Sources/MaqsCore/MaqsVersion.swift | cut -d '"' -f 2 || true)
          terrain=$(grep -o 'static let string = "[^"]*"' Sources/MaqsTerrain/TerrainVersion.swift | cut -d '"' -f 2 || true)
          if [ -z "$core" ] || [ -z "$terrain" ] || [ "$core" != "$terrain" ]; then
            echo "MaqsVersion.string is '$core' and TerrainVersion.string is '$terrain': both must be set and equal" >&2
            exit 1
          fi
          echo "version: $core"
      - name: Fixtures stay under the cap
        run: |
          size_kb=$(du -sk Tests/MaqsTestSupport/Fixtures | cut -f1)
          echo "fixtures: ${size_kb} KB"
          test "$size_kb" -le 8192
      - name: No binary data outside the fixtures and the bundled glyphs
        run: |
          # The bundled glyphs are the one generated asset committed outside the fixtures, .pbf files only, written by
          # scripts/update-map-assets.sh (ADR 0017). A .pmtiles or .sqlite file is refused there too.
          if git ls-files | grep -E '\.(pmtiles|sqlite|pbf)$' | grep -v '^Tests/MaqsTestSupport/Fixtures/' \
            | grep -v -E '^Sources/MaqsUI/MapAssets/glyphs/.*\.pbf$'; then
            echo 'generated data outside Tests/MaqsTestSupport/Fixtures and the bundled glyphs' >&2; exit 1
          fi

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: swift --version
      # Warnings are errors from the command line, not Package.swift: Xcode 26.6 rejects a manifest warning flag
      # on a package it builds as a dependency (ADR 0018).
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test -Xswiftc -warnings-as-errors

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: xcodebuild -version
      - name: Test on the iOS Simulator
        run: |
          set -o pipefail
          # Xcode names the scheme Maqs while the package has one library product, Maqs-Package once it has several.
          # Use Maqs-Package when it is listed, else Maqs; fail when the listing fails or the chosen scheme is not listed.
          scheme=$(xcodebuild -list -json | jq -er '
            .workspace.schemes as $schemes
            | (if any($schemes[]; . == "Maqs-Package") then "Maqs-Package" else "Maqs" end) as $chosen
            | if any($schemes[]; . == $chosen) then $chosen else error("no Maqs or Maqs-Package scheme") end') \
            || { echo 'could not pick the Xcode scheme: xcodebuild -list -json failed or lists neither Maqs-Package nor Maqs' >&2; exit 1; }
          echo "scheme: $scheme"
          # Without -collect-test-diagnostics never, a test that hits its time limit adds about ten minutes of simctl diagnose.
          # SWIFT_TREAT_WARNINGS_AS_ERRORS=YES makes warnings errors in every target, as -warnings-as-errors does for swift build.
          set +e
          xcodebuild -scheme "$scheme" \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipPackagePluginValidation -collect-test-diagnostics never \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test > xcodebuild.log 2>&1
          status=$?
          set -e
          fail() { echo "$1" >&2; tail -50 xcodebuild.log; exit 1; }
          # Swift Testing's issue lines name the failing expectation and its file and line.
          grep -E '": error:|recorded an issue|Test run with|TEST (SUCCEEDED|FAILED)' xcodebuild.log || true
          if grep -q '": error:' xcodebuild.log || grep -qE 'Test run with .* failed|\*\* TEST FAILED \*\*' xcodebuild.log; then
            fail 'xcodebuild reported errors or failed tests'
          fi
          grep -q 'Test run with [1-9][0-9]* tests.* passed' xcodebuild.log || fail 'no passing "Test run with N tests" line'
          if [ "$status" -ne 0 ]; then
            echo "xcodebuild exited with status $status" >&2
            tail -50 xcodebuild.log
          fi
          exit "$status"
      - name: Build the demo app
        run: |
          # The demo is the package's only consumer in this repository; building it keeps it from rotting.
          set +e
          xcodebuild -project Examples/MaqsDemo/MaqsDemo.xcodeproj -scheme MaqsDemo \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > demo.log 2>&1
          status=$?
          set -e
          grep -E '": error:|\*\* BUILD (SUCCEEDED|FAILED) \*\*' demo.log || true
          if grep -q '": error:' demo.log || [ "$status" -ne 0 ]; then
            echo "the demo app did not build (xcodebuild exited with status $status)" >&2
            tail -50 demo.log
            exit 1
          fi
