# config/regions.yaml
schema_version: 1
hd_max_zoom: 13
curvature:
  highways: [motorway, trunk, primary, secondary, tertiary, unclassified,
             motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
  exclude_surfaces: [gravel, dirt, ground, grass, sand, unpaved, compacted, fine_gravel,
                     mud, earth, wood, pebblestone]
base_packs:
  - id: triveneto
    regions: [triveneto]
    max_zoom: 10
regions:
  - id: test
    name: { it: Nevegal (test), en: Nevegal (test) }
    bbox: [12.21, 46.08, 12.29, 46.13]
    # no tile ring: it costs ~15 MB at z0-11 whatever the bbox; without it the fixture stays < 5 MB
    bbox_border: 0
    fixture: true
    osm: { geofabrik: europe/italy/nord-est }
  - id: triveneto
    name: { it: Triveneto, en: Triveneto }
    bbox: [10.3818, 44.7923, 13.9187, 47.0921]
    osm: { geofabrik: europe/italy/nord-est }
