# config/regions.yaml
schema_version: 1
hd_max_zoom: 13
curvature:
  highways: [motorway, trunk, primary, secondary, tertiary, unclassified,
             motorway_link, trunk_link, primary_link, secondary_link, tertiary_link]
  exclude_surfaces: [gravel, dirt, ground, grass, sand, unpaved, compacted, fine_gravel,
                     mud, earth, wood, pebblestone]
base_packs:
  - id: triveneto
    regions: [triveneto]
    max_zoom: 10
regions:
  - id: test
    name: { it: Nevegal (test), en: Nevegal (test) }
    bbox: [12.21, 46.08, 12.29, 46.13]
    # no tile ring: it costs ~15 MB at z0-11 whatever the bbox; without it the fixture stays < 5 MB
    bbox_border: 0
    fixture: true
    osm: { geofabrik: europe/italy/nord-est }
  - id: triveneto
    name: { it: Triveneto, en: Triveneto }
    bbox: [10.3818, 44.7923, 13.9187, 47.0921]
    osm: { geofabrik: europe/italy/nord-est }
    clip: { admin: [43648, 179296, 45757] }
    # every place in the box, where the terrain is: the extracts whose Geofabrik .poly meets it (ADR 0020)
    places: { extent: bbox, neighbours: [europe/austria, europe/slovenia, europe/switzerland, europe/italy/nord-ovest, europe/croatia] }
    # places 43,610 on 2026-11-26 (box cut, towns and cities; ADR 0020)
    expect: { trails: [5000, 17000], places: [26000, 87000], curvature_segments: [130000, 440000] }
  - id: veneto
    name: { it: Veneto, en: Veneto }
    bbox: [10.6231, 44.7923, 13.1021, 46.6806]
    osm: { geofabrik: europe/italy/nord-est }
    clip: { admin: [43648] }
    places: { extent: bbox, neighbours: [europe/austria, europe/italy/nord-ovest] }
    # Phase 0: 1,955 hiking relations, 13,408 place nodes
    # places 24,556 on 2026-11-26 (box cut, towns and cities; ADR 0020)
    expect: { trails: [1500, 3000], places: [14700, 49000], curvature_segments: [75000, 250000] }
  - id: friuli-venezia-giulia
    name: { it: Friuli-Venezia Giulia, en: Friuli-Venezia Giulia }
    bbox: [12.3214, 45.5809, 13.9187, 46.6480]
    osm: { geofabrik: europe/italy/nord-est }
    clip: { admin: [179296] }
    places: { extent: bbox, neighbours: [europe/austria, europe/slovenia] }
    # places 11,056 on 2026-11-26 (box cut, towns and cities; ADR 0020)
    expect: { trails: [750, 2500], places: [6600, 22000], curvature_segments: [28000, 94000] }
  - id: trentino-alto-adige
    name: { it: Trentino-Alto Adige/Südtirol, en: Trentino-South Tyrol }
    bbox: [10.3818, 45.6729, 12.4780, 47.0921]
    osm: { geofabrik: europe/italy/nord-est }
    clip: { admin: [45757] }
    places: { extent: bbox, neighbours: [europe/austria, europe/switzerland, europe/italy/nord-ovest] }
    # places 20,309 on 2026-11-26 (box cut, towns and cities; ADR 0020)
    expect: { trails: [3500, 11500], places: [12000, 40600], curvature_segments: [27000, 91000] }
