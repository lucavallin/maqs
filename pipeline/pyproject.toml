[project]
name = "maqs"
version = "0.1.0"
description = "Builds the maqs map data packs: tile extracts, data layers, validation and reports."
requires-python = ">=3.12"
dependencies = ["click>=8.1", "pyyaml>=6.0", "osmium>=4.3", "pillow>=12.0", "jsonschema>=4.23"]

[project.scripts]
maqs = "maqs.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maqs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: builds against live sources; skipped unless --run-network"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]
